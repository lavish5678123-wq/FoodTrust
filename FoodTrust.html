<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodTrust</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3faf7;
    color:#17352c;
}

#splash{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#063b2d,#0b8060);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    animation:hide 3s forwards;
}

.logo{
    width:110px;
    height:110px;
    background:white;
    color:#087957;
    border-radius:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    animation:float 1.5s infinite;
}

#splash h1{
    margin-top:20px;
    font-size:40px;
}

#splash p{
    margin-top:10px;
    text-align:center;
    padding:0 20px;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-15px)}
}

@keyframes hide{
    0%,75%{opacity:1}
    100%{
        opacity:0;
        visibility:hidden;
    }
}

header{
    background:#063b2d;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.brand{
    font-size:24px;
    font-weight:bold;
}

nav button{
    background:none;
    border:none;
    color:white;
    margin:5px;
    padding:10px;
    cursor:pointer;
}

main{
    width:90%;
    max-width:1200px;
    margin:auto;
}

section{
    padding:45px 0;
}

.hero{
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:44px;
    margin-bottom:15px;
}

.hero p{
    color:#61736c;
}
